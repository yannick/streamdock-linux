[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yannick/streamdock-linux"

[workspace.dependencies]
streamdock-hid = { path = "crates/streamdock-hid" }
streamdock-proto = { path = "crates/streamdock-proto" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Complexity gates (H15-36); thresholds in clippy.toml.
cognitive_complexity = "warn"
excessive_nesting = "warn"

# H15-67: selected only by `just build-armv7`; host release/check stay unchanged.
[profile.release-armv7]
inherits = "release"
lto = "thin"
codegen-units = 1
