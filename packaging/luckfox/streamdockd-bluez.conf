<!-- streamdockd's settings page may manage Bluetooth through BlueZ (H15-38): the service's group
     "bluetooth" may call org.bluez, and BlueZ may call our pairing agent. Installed into
     /etc/dbus-1/system.d/ by install.sh. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
  </policy>
  <policy user="root">
    <allow send_interface="org.bluez.Agent1"/>
  </policy>
</busconfig>
