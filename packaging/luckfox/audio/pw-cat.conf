# H15-62: dedicated client config for streamdockd's pw-cat (PipeWire 0.3.48).
# The stock client.conf does not load module-rt. Do not install this globally: pw-dump,
# wpctl and other clients retain their own config. The service grants RTPRIO 20;
# player-output uses FIFO 10, and this client's data thread uses FIFO 20.
context.properties = { log.level = 2 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
      args = { rt.prio = 20 nice.level = -11 }
      flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-session-manager }
]
