}

message GetLightsTabResponse {
  // The area whose lights fill the keys when nothing is pinned.
  string area = 1;
  // Keys show the pinned entities (not the area's lights).
  bool pinned = 2;
  // What each key shows now (pinned or from the area), when Home Assistant answered.
  repeated LightsKey keys = 3;
  // Knob 1 and 2: "brightness", "color_temp" or "none".
  string knob1 = 4;
  string knob2 = 5;
}

message LightsKey {
  uint32 key = 1;
  string entity = 2;
  // Empty: the entity's name.
  string label = 3;
  // Cover only: open, close, stop. Mutually exclusive with service.
  string action = 4;
  // domain.service, targeting only entity; no custom data.
  string service = 5;
  // Built-in icon or uploaded image name. Empty: domain/state default.
  string icon = 6;
}

message SetLightsKeyRequest {
  string mode = 1;
  uint32 key = 2;
  // Empty: the key shows nothing.
  string entity = 3;
  string label = 4;
  // Cover only: open, close, stop. Mutually exclusive with service.
  string action = 5;
  // domain.service, targeting only entity; no custom data.
