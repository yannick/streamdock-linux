  string name = 1;
  uint32 width = 2;
  uint32 height = 3;
  // Size of the stored PNG.
  uint64 size_bytes = 4;
  // A PNG of at most 64×64 pixels.
  bytes preview = 5;
  // A built-in icon (H15-48), shipped with the daemon and tinted by the key's state; can't be
  // deleted, but an upload with the same name replaces it.
  bool builtin = 6;
  // For built-in icons: "Lights", "Blinds", "Home", "Audio", "Tools".
  string group = 7;
}

