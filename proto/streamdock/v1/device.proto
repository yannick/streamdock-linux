  bytes data = 2;
}

message SetKeyAssetResponse {
  KeyAsset asset = 1;
}

message DeleteKeyAssetRequest {
  string name = 1;
}

message DeleteKeyAssetResponse {
  // False when there was no image of that name.
  bool deleted = 1;
}

// ---------- Custom keys editor (H15-29) ----------

// `[modules.keys]`.
message KeyPages {
  // Whether the keys module is enabled.
  bool enabled = 1;
  // Allows `command` actions (they run programs as the daemon's user).
  bool allow_commands = 2;
  repeated KeyPage pages = 3;
}

// `[[modules.keys.page]]`: one mode.
message KeyPage {
  // Mode id; empty for the default ("keys", "keys-2", …).
  string id = 1;
  string title = 2;
  repeated KeySlot keys = 3;
  repeated KnobSlot knobs = 4;
}

// `[[modules.keys.page.key]]`.
message KeySlot {
  // 1-6 LCD keys, 7-9 buttons.
  uint32 key = 1;
  string label = 2;
  string detail = 3;
  // Uploaded key image name (H15-28); empty for none.
  string image = 4;
  KeyAction action = 5;
}

// `[[modules.keys.page.knob]]`: knob 1 or 2 (knob 3 switches modes).
message KnobSlot {
  uint32 knob = 1;
  string label = 2;
  // At least one of them.
  KeyAction turn = 3;
  KeyAction press = 4;
}

message KeyAction {
  oneof kind {
    HttpAction http = 1;
    CommandAction command = 2;
    ModeAction mode = 3;
    ProfileAction profile = 4;
    BrightnessAction brightness = 5;
    HomeAssistantAction homeassistant = 6;
    LyrionAction lyrion = 7;
    MultiAction multi = 8;
    ToggleAction toggle = 9;
    AudioAction audio = 10;
    AssistAction assist = 11;
  }
}

// Push-to-talk (H15-43): while the key is held, the request goes to Home Assistant's assist pipeline
// (settings in `[modules.homeassistant.assist]`); only directly on a key.
message AssistAction {
  // Tap mode (H15-69): a tap starts, the end of speech ends it; false = hold to talk.
  bool tap = 1;
}

// This machine's audio output (H15-50; needs `[audio] manage = true`).
message AudioAction {
  oneof change {
    // Change the selected output's volume by this many percent per knob detent (or per press).
    int32 step = 1;
    // Mute or unmute the selected output.
    bool toggle_mute = 2;
  }
}

message HttpAction {
  // Default "POST".
  string method = 1;
  string url = 2;
  // Empty: no body.
  string body = 3;
  map<string, string> headers = 4;
  // 0: the default (10 s).
  uint32 timeout_ms = 5;
}

message CommandAction {
  // Program and arguments; no shell.
  repeated string argv = 1;
  uint32 timeout_ms = 2;
}

message ModeAction {
  string id = 1;
}

message ProfileAction {
  string name = 1;
}

message BrightnessAction {
  oneof change {
    // Set to this percentage.
    uint32 set = 1;
    // Change by this many percent per knob detent (or per press).
    int32 step = 2;
  }
}

message HomeAssistantAction {
  // "domain.service", e.g. "light.toggle".
  string service = 1;
  // The service data as a JSON object, e.g. {"entity_id": "light.desk"}; empty for none.
  string data_json = 2;
}

message LyrionAction {
  // An LMS command for the configured player, e.g. ["mixer", "volume", "{delta}"].
  repeated string command = 1;
  // Another player than `[modules.lyrion] player` (name or MAC); empty for that one.
  string player = 2;
}

message MultiAction {
  repeated MultiStep steps = 1;
}

message MultiStep {
  oneof step {
    KeyAction action = 1;
    // Wait this long (at most 60000).
    uint32 delay_ms = 2;
  }
}

message ToggleAction {
  KeyAction on = 1;
  KeyAction off = 2;
  string on_label = 3;
  string off_label = 4;
  string on_image = 5;
  string off_image = 6;
  // A Home Assistant entity the key follows; empty: the one both sides call, if any.
  string state = 7;
}

message GetKeyPagesRequest {}

message GetKeyPagesResponse {
  KeyPages pages = 1;
  // For the pickers: the other modes' ids, configured profiles and uploaded key images.
  repeated string modes = 2;
  repeated string profiles = 3;
  // Uploaded key images (H15-28).
  repeated string images = 4;
  // Whether `[modules.homeassistant]` / `[modules.lyrion]` are configured (their actions need them).
  bool homeassistant = 5;
  bool lyrion = 6;
  // Built-in icons (H15-48), usable like images.
  repeated KeyAsset icons = 7;
}

message SaveKeyPagesRequest {
  KeyPages pages = 1;
}

message SaveKeyPagesResponse {
  // True if applying failed and the daemon must be restarted to use the new keys.
  bool restart_required = 1;
}

message AddTabRequest {
  // "lights", "music" or "keys".
  string kind = 1;
  string title = 2;
  // Lights: the area whose lights fill the keys; empty = start empty and pin entities per key.
  string area = 3;
  // Music: the player; empty = the default player.
  string player = 4;
