// ---------- Network: Wi-Fi and Bluetooth (H15-38) ----------

message GetNetworkRequest {}

message GetNetworkResponse {
  // `[network] manage` is on; when false nothing else is set.
  bool managed = 1;
  WifiStatus wifi = 2;
  BluetoothStatus bluetooth = 3;
  EthernetStatus ethernet = 4;
  // "off", "fallback" or "both" (see SetWifiMode).
  string wifi_mode = 5;
}

message WifiStatus {
  // NetworkManager has a Wi-Fi device; else `problem` says why not.
  bool available = 1;
  // e.g. "wlan0".
  string interface = 2;
  // Empty when not connected.
  string connected_ssid = 3;
  string problem = 4;
  // Every IPv4 and IPv6 address on the link, as "address/prefix".
  repeated string addresses = 5;
  // The radio is on (see GetNetworkResponse.wifi_mode).
  bool radio_on = 6;
  repeated NetworkAddress address_details = 7;
  string gateway = 8;
  string gateway6 = 9;
  repeated string dns = 10;
}

// One address, with Linux address flags where available (H15-63).
message NetworkAddress {
  // Address and prefix, e.g. "2001:db8::1/64".
  string cidr = 1;
  // "global", "link-local", "unique-local", "private" or "loopback".
  string scope = 2;
  bool temporary = 3;
  bool stable_privacy = 4;
}

// Configured values, rather than addresses or DNS learned from the router.
message EthernetIpv6Settings {
  string method = 1;
  string address = 2;
  uint32 prefix = 3;
  string gateway = 4;
  repeated string dns = 5;
}

message BluetoothStatus {
  // BlueZ has an adapter; else `problem` says why not (e.g. no Bluetooth stack).
  bool available = 1;
  bool powered = 2;
  // The adapter's name, as other devices see it.
  string name = 3;
  string problem = 4;
}

message WifiNetwork {
  string ssid = 1;
  // 0-100.
  uint32 signal = 2;
  // Needs a password (WPA/WEP).
  bool secure = 3;
  uint32 frequency_mhz = 4;
  bool in_use = 5;
  // A saved connection exists, so no password is needed.
  bool saved = 6;
}

message ListWifiNetworksRequest {
  bool rescan = 1;
}

message ListWifiNetworksResponse {
  repeated WifiNetwork networks = 1;
}

message ConnectWifiRequest {
  string ssid = 1;
  string password = 2;
}

message ConnectWifiResponse {}

message DisconnectWifiRequest {}

message DisconnectWifiResponse {}

message ForgetWifiRequest {
  string ssid = 1;
}

message ForgetWifiResponse {
  // False when nothing was saved for that SSID.
  bool forgotten = 1;
}

message BluetoothDevice {
  // "00:11:22:33:44:55".
  string address = 1;
  string name = 2;
  bool paired = 3;
  bool connected = 4;
  // Offers an audio profile (speaker, headset).
  bool audio = 5;
  // BlueZ's icon name, e.g. "audio-headset".
  string icon = 6;
  // The codec of the audio stream, e.g. "LDAC 48 kHz" or "SBC-XQ 44.1 kHz"; empty without one.
  string codec = 7;
}

message GetBluetoothDeviceRequest {
  string address = 1;
}

message GetBluetoothDeviceResponse {
  BluetoothDeviceDetail device = 1;
}

message BluetoothDeviceDetail {
  BluetoothDevice device = 1;
  // BlueZ's alias (the name the user may have set).
  string alias = 2;
  // "public" or "random".
  string address_type = 3;
  // The class of device, e.g. "0x240404", with its meaning ("Audio/Video: headphones").
  string class = 4;
  string class_text = 5;
  bool trusted = 6;
  bool blocked = 7;
  // Long-term keys stored; unset where BlueZ doesn't say (before 5.69).
  optional bool bonded = 8;
  bool legacy_pairing = 9;
  // Signal strength in dBm; only while a scan sees the device.
  optional int32 rssi = 10;
  // Battery in percent, if the device reports it.
  optional uint32 battery = 11;
  // e.g. "usb:v054Cp0D58d0100".
  string modalias = 12;
  repeated BluetoothProfile profiles = 13;
  repeated BluetoothTransport transports = 14;
  // The controller: "hci0", its address and how it is attached ("UART", "USB", "SDIO").
  string adapter = 15;
  string adapter_address = 16;
  string adapter_bus = 17;
  // H15-53: more of what BlueZ knows.
  // Where the battery level comes from, e.g. "HFP" (BlueZ 5.66+).
  string battery_source = 18;
  // Advertised transmit power in dBm; only from a scan.
  optional int32 tx_power = 19;
  // BlueZ has read the device's services.
  bool services_resolved = 20;
  // The device may wake this machine.
  bool wake_allowed = 21;
  // GAP appearance of LE devices, e.g. "0x0941 (wearable audio device)".
  string appearance = 22;
  // Advertised manufacturer data.
  repeated BluetoothManufacturerData manufacturer_data = 23;
  // The modalias decoded: "Sony (054C), product 0D58, version 0100 (USB IDs)".
  string device_id = 24;
  // The controller's name as others see it, its device ID and roles ("central", "peripheral").
  string adapter_name = 25;
  string adapter_device_id = 26;
  repeated string adapter_roles = 27;
  bool adapter_discoverable = 28;
  bool adapter_pairable = 29;
  // The live link while connected (H15-53); unset while not connected.
  BluetoothLink link = 30;
  // H15-78: the audio codecs PipeWire offers for this device while it is connected (empty
  // otherwise, or where the daemon doesn't manage the audio), the active one, LDAC's quality and
  // the remembered choice (reapplied on every connect).
  repeated BluetoothCodec codecs = 31;
  string active_codec = 32;
  // "auto", "hq", "sq" or "mq" while LDAC is active.
  string ldac_quality = 33;
  BluetoothCodecChoice preferred = 34;
  // The A2DP link's sample rate in Hz while connected (0 = unknown). The audio graph runs at
  // 48 kHz; at another rate the Bluetooth sink resamples (H15-78).
  uint32 link_rate = 35;
  // false (default): a link at another rate than 48 kHz is renegotiated once per connect;
  // true: the rate the headset chose is kept.
  bool any_link_rate = 36;
}

message BluetoothCodec {
  // PipeWire's id, e.g. "ldac", "sbc_xq".
  string id = 1;
  // e.g. "LDAC", "SBC-XQ".
  string label = 2;
}

message BluetoothCodecChoice {
  // Codec id; empty = PipeWire's automatic choice.
  string codec = 1;
  // For LDAC: "auto", "hq", "sq" or "mq"; empty = auto.
  string ldac_quality = 2;
}

// A connection's live state from the kernel (MGMT "Get Connection Information"). Reading it needs
// CAP_NET_ADMIN, which the Luckfox service has.
message BluetoothLink {
  // Received signal strength in dBm.
  optional int32 rssi = 1;
  // Our transmit power on this link and its maximum, in dBm.
  optional int32 tx_power = 2;
  optional int32 max_tx_power = 3;
  // Why the link could not be read, e.g. "needs CAP_NET_ADMIN"; empty when it was.
  string problem = 4;
}

message BluetoothManufacturerData {
  // Bluetooth SIG company identifier.
  uint32 company_id = 1;
  // e.g. "Sony"; empty where we don't know it.
  string company = 2;
  // The payload as hex.
  string data_hex = 3;
}

message BluetoothProfile {
  string uuid = 1;
  // e.g. "A2DP sink"; empty for vendor UUIDs.
  string name = 2;
}

// An audio stream (BlueZ MediaTransport1).
message BluetoothTransport {
  // Our side's profile, e.g. "A2DP source" when we play to a headset.
  string profile = 1;
  // "idle", "pending" or "active".
  string state = 2;
  // e.g. "LDAC 48 kHz".
  string codec = 3;
  // Decoded configuration, e.g. "48 kHz, stereo" or "44.1 kHz, dual channel, bitpool 2–53".
  string configuration = 4;
  // The raw configuration bytes as hex ("2d 01 00 00 aa 00 10 01").
  string configuration_hex = 5;
  // AVRCP absolute volume 0–127, if the device supports it.
  optional uint32 volume = 6;
  // The bandwidth of the stream (H15-53), e.g. "up to 328 kbit/s" or "330–990 kbit/s, chosen by
  // the encoder" (LDAC); empty where unknown.
  string bitrate = 7;
  // The delay the device reports (A2DP delay reporting), in milliseconds.
  optional double delay_ms = 8;
}

message ListBluetoothDevicesRequest {
  bool scan = 1;
}

message ListBluetoothDevicesResponse {
  repeated BluetoothDevice devices = 1;
  // A scan is running (it runs ~30 s in the background; poll while true, H15-45).
  bool scanning = 2;
}

message ConnectBluetoothRequest {
  string address = 1;
}

message ConnectBluetoothResponse {}

message DisconnectBluetoothRequest {
  string address = 1;
}

message DisconnectBluetoothResponse {}

message RemoveBluetoothRequest {
  string address = 1;
}

message RemoveBluetoothResponse {}

message SetBluetoothPowerRequest {
  bool on = 1;
}

message SetBluetoothPowerResponse {}

message EthernetStatus {
  bool available = 1;
  // e.g. "eth0".
  string interface = 2;
  // A cable with a live link is plugged in.
  bool carrier = 3;
  bool connected = 4;
  // The configured method: DHCP, else a static address.
  bool dhcp = 5;
  // The current IPv4 address and prefix (from DHCP or static), e.g. "192.168.1.141" / 24.
  string address = 6;
  uint32 prefix = 7;
  string gateway = 8;
  repeated string dns = 9;
  // A change is on trial and is reverted in this many seconds unless confirmed; 0 = none.
  uint32 revert_in_seconds = 10;
  string problem = 11;
  // Every IPv4 and IPv6 address on the link, as "address/prefix" (H15-44).
  repeated string addresses = 12;
  string gateway6 = 13;
  // NetworkManager's IPv6 method: "auto", "dhcp", "manual", "disabled", "ignore".
  string ipv6_method = 14;
  repeated NetworkAddress address_details = 15;
  EthernetIpv6Settings ipv6_config = 16;
  // IPv4 DNS only, for the IPv4 form (dns above includes both families).
  repeated string ipv4_dns = 17;
}

message SetEthernetRequest {
  // DHCP; when false, the static fields below apply.
  bool dhcp = 1;
  string address = 2;
  // e.g. 24.
  uint32 prefix = 3;
  // Optional.
  string gateway = 4;
  repeated string dns = 5;
  // IPv6: "auto" (SLAAC), "dhcp", "static" or "disabled"; empty keeps the current setup.
  string ipv6_method = 6;
  string ipv6_address = 7;
  // e.g. 64.
  uint32 ipv6_prefix = 8;
  string ipv6_gateway = 9;
  repeated string ipv6_dns = 10;
  // IPv6-only change: preserve the entire applied/saved IPv4 section unchanged.
  bool keep_ipv4 = 11;
}

message SetEthernetResponse {
  // The change is reverted in this many seconds unless ConfirmEthernet is called.
  uint32 revert_in_seconds = 1;
}

message ConfirmEthernetRequest {}

message ConfirmEthernetResponse {}

message SetWifiModeRequest {
  // "off", "fallback" or "both".
  string mode = 1;
}

message SetWifiModeResponse {}

// This machine's audio (H15-50).
message AudioState {
  // Every output (PipeWire sink) except our tone filter, in a stable order.
  repeated AudioOutput outputs = 1;
  AudioTone tone = 2;
  // Why the audio can't be read (PipeWire not running …); empty when fine.
  string problem = 3;
  // The correction presets to choose from (H15-54).
  repeated AudioPreset presets = 4;
}

message AudioOutput {
  // PipeWire node name, e.g. "bluez_output.02_00_00_00_00_B4.a2dp-sink"; the id for Set* calls.
  string name = 1;
  // Human name, e.g. "WH-1000XM4", "Built-in Audio Stereo".
  string description = 2;
  // "bluetooth", "usb", "builtin" or "other".
  string kind = 3;
  // Everything plays here.
  bool selected = 4;
  // 0..=150, as wpctl shows it (cubic, 100 = unity).
  uint32 volume_percent = 5;
  bool muted = 6;
  // Bluetooth codec, e.g. "ldac", "sbc_xq"; empty otherwise.
  string codec = 7;
  // Playing right now.
  bool running = 8;
  // Sample rate PipeWire runs it at, e.g. 48000; 0 if unknown.
  uint32 sample_rate = 9;
  // Bluetooth while playing: what the controller sends (the codec's real bitrate), measured every
  // 3 s; 0 otherwise.
  uint32 bitrate_kbps = 10;
}

message AudioTone {
  // Gain in dB, -12..=12; 0 = flat.
  double bass_db = 1;
  double mid_db = 2;
  double treble_db = 3;
  // -1 (left only) ..= 1 (right only); 0 = centre.
  double balance = 4;
  // The DSP runs (the board's "Streamdock DSP" sink); when false, no sound setting can apply.
  bool available = 5;
  // Sound character (H15-54): -1 warm ..= 1 bright, and -1 relaxed ..= 1 energetic.
  double warmth = 6;
  double energy = 7;
  // More bass (and a little treble) the lower the volume.
  bool loudness = 8;
  // Correction EQ: a preset id (`AudioState.presets`), "custom" (then `bands`) or "" (off).
  string correction = 9;
  // The custom correction: 10 bands, a low shelf, 8 peaks, a high shelf.
  repeated AudioBand bands = 10;
  // Gain before the limiter, -20..=20 dB (a correction preset adds its own).
  double preamp_db = 11;
  // Headphone crossfeed (bs2b) and its feeding level, 1..=15 dB (lower = stronger).
  bool crossfeed = 12;
  double crossfeed_db = 13;
  // Limiter ceiling, -20..=0 dB.
  double limit_db = 14;
  // What loudness adds right now at the current volume (read-only).
  double loudness_bass_db = 15;
  double loudness_treble_db = 16;
}

message AudioBand {
  double freq_hz = 1;
  double gain_db = 2;
  double q = 3;
}

// A built-in correction target, e.g. a headphone's AutoEq EQ.
message AudioPreset {
  string id = 1;
  string label = 2;
}

message GetAudioRequest {}

message GetAudioResponse {
  // False where the daemon doesn't manage the audio; then `state` is unset.
  bool managed = 1;
  AudioState state = 2;
}

message SetAudioOutputRequest {
  string name = 1;
}

message SetAudioOutputResponse {}

message SetAudioVolumeRequest {
  string name = 1;
  // 0..=150.
  uint32 volume_percent = 2;
  bool muted = 3;
}

message SetAudioVolumeResponse {}

message SetAudioToneRequest {
  // `available` and the read-only loudness values are ignored.
  AudioTone tone = 1;
}

message SetAudioToneResponse {}

// `[player]` in the config (H15-52).
message PlayerSettings {
  bool enabled = 1;
  // The name in Lyrion.
  string name = 2;
  // A fixed server, "ip" or "ip:port"; empty = find one by discovery.
  string server = 3;
  // Highest sample rate offered to Lyrion (it resamples above): 44100, 48000, 96000 or 192000.
  uint32 max_sample_rate = 4;
  // Formats offered to Lyrion in preference order ("flac", "mp3", "pcm"); ["pcm"] = Lyrion
  // transcodes everything.
  repeated string formats = 5;
  // Decoded audio buffered before the output, 1000 to 20000 ms.
  uint32 output_buffer_ms = 6;
  // "off", "track", "album" or "smart"; empty = Lyrion's own setting.
  string replay_gain = 7;
  // "dsp" (through the sound settings, default), "default" (the default output, no DSP) or an
  // output's name (`AudioOutput.name`, no DSP).
  string output = 8;
  // Between tracks: "none", "crossfade", "fade-in", "fade-out" or "fade-in-out"; empty = Lyrion's
  // own setting. A crossfade raises the output buffer to its length + 1 s.
  string transition = 9;
  // Its length, 1 to 10 s.
  uint32 transition_seconds = 10;
  // Who converts to the output's sample rate (H15-80): "pipewire", or the player at "fast",
  // "balanced" (default) or "high" quality; empty = the default.
  string resampling = 11;
}

message GetPlayerRequest {}

message GetPlayerResponse {
  PlayerSettings settings = 1;
  // The player's state; `enabled` is false while it is off.
  PlayerState state = 2;
  // The sample rates `max_sample_rate` may take.
  repeated uint32 sample_rates = 3;
  // The outputs `output` may name, where the daemon manages the audio.
  repeated PlayerOutput outputs = 4;
}

message PlayerOutput {
  string name = 1;
  string description = 2;
}

message ReconnectPlayerRequest {}

message ReconnectPlayerResponse {}

message ResetPlayerIdRequest {}

message ResetPlayerIdResponse {
  string player_id = 1;
}

message SetPlayerRequest {
  PlayerSettings settings = 1;
}

message SetPlayerResponse {}

message FindLyrionServersRequest {}

message FindLyrionServersResponse {
  repeated LyrionServer servers = 1;
}

message LyrionServer {
  // "ip:port" of its player protocol (port 3483).
  string address = 1;
  string name = 2;
  string version = 3;
  // Its web UI and JSON-RPC port, usually 9000; 0 if unknown.
  uint32 http_port = 4;
}

// ---------- Voice (H15-68, H15-69) ----------

message VoiceSettings {
  // Assist pipeline id; empty = Home Assistant's preferred one.
  string pipeline = 1;
  // PipeWire source; empty = the default source.
  string microphone = 2;
  // Play Home Assistant's spoken answer.
  bool speak = 3;
  // End of speech: silence after speech (ms), speech score threshold (0.05-0.95), give up without
  // speech (ms), longest recording (s).
  uint32 silence_ms = 4;
  float vad_threshold = 5;
  uint32 no_speech_ms = 6;
  uint32 max_seconds = 7;
  // Wake word model id; empty = no wake word.
  string wake_word = 8;
  // Its detection threshold 0.5-0.99; unset = the model's own.
  optional float wake_threshold = 9;
}

message WakeWordModel {
  string id = 1;
  // What to say, e.g. "Okay Nabu".
  string wake_word = 2;
  // Languages it was trained for.
  repeated string languages = 3;
  // Its default threshold and sliding window (invocations of 30 ms).
  float threshold = 4;
  uint32 window = 5;
  bool builtin = 6;
  uint32 size_bytes = 7;
  string author = 8;
}

message Microphone {
  // PipeWire node name and description.
  string name = 1;
  string description = 2;
}

message GetVoiceRequest {}

message GetVoiceResponse {
  // Home Assistant is set up (push-to-talk and the wake word need it).
  bool available = 1;
  VoiceSettings settings = 2;
  repeated WakeWordModel models = 3;
  // The microphones PipeWire offers right now.
  repeated Microphone microphones = 4;
  // A WAV that replaces the microphone (`test_input`, for development); empty when unset.
  string test_input = 5;
}

message SaveVoiceRequest {
  VoiceSettings settings = 1;
}

message SaveVoiceResponse {}

message ListAssistPipelinesRequest {}

message ListAssistPipelinesResponse {
  repeated AssistPipeline pipelines = 1;
  // The id of Home Assistant's preferred pipeline.
  string preferred = 2;
}

message AssistPipeline {
  string id = 1;
  string name = 2;
  string language = 3;
  // The speech-to-text language, e.g. "en".
  string stt_language = 4;
}

message UploadWakeWordRequest {
  // The `.tflite` model and its microWakeWord manifest (`.json`).
  bytes model = 1;
  bytes manifest = 2;
}

message UploadWakeWordResponse {
  WakeWordModel model = 1;
}

message DeleteWakeWordRequest {
  string id = 1;
}

message DeleteWakeWordResponse {}

message SetBluetoothCodecRequest {
  string address = 1;
  BluetoothCodecChoice choice = 2;
}

message SetBluetoothCodecResponse {}

message SetBluetoothLinkRateRequest {
  string address = 1;
  // true: keep the rate the headset chooses; false: 48 kHz.
  bool any_rate = 2;
}

message SetBluetoothLinkRateResponse {}

// ---------- Output priority (H15-79) ----------

message OutputPriority {
  // Highest first.
  repeated PriorityOutput outputs = 1;
  // Disconnect other Bluetooth audio devices while a higher one plays (off: they stay connected
  // but never play unless chosen).
  bool disconnect_others = 2;
}

message PriorityOutput {
  // PipeWire node name.
  string name = 1;
  // Bluetooth address for a Bluetooth output (any of its profiles counts); empty otherwise.
  string bluetooth = 2;
  // Its description, also shown while it is absent.
  string label = 3;
  // Present right now (in responses).
  bool present = 4;
}

message GetOutputPriorityRequest {}

message GetOutputPriorityResponse {
  OutputPriority priority = 1;
}

message SetOutputPriorityRequest {
  OutputPriority priority = 1;
}

message SetOutputPriorityResponse {}

// Build identity (H15-77).
message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  // Ten-character SHA with optional -dirty; unknown in a source archive.
  string revision = 2;
  // Full SHA, or unknown without git.
  string commit = 3;
  string commit_url = 4;
  // Build time as UTC Unix seconds; clients display it in their local time zone.
  uint64 built_at = 5;
  bool dirty = 6;
}
