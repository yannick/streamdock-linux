  string mode = 1;
}

// `now_playing` of a music tab (H15-88).
message NowPlayingSettings {
  // LCD keys of the band, left to right (at most 3); empty: no band on the dock.
  repeated uint32 keys = 1;
  // "title", "artist", "album" in the order shown.
  repeated string fields = 2;
  string separator = 3;
  // Scroll speed in px per second (5-200) and the pause at each end (0-10000 ms).
  uint32 speed = 4;
  uint32 pause_ms = 5;
  // Scroll long text; false: cut it with "…".
  bool scroll = 6;
  bool cover = 7;
  bool progress = 8;
  // Frames per second on the dock while scrolling (1-10).
  uint32 fps = 9;
}

message GetNowPlayingRequest {
