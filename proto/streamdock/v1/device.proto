syntax = "proto3";

package streamdock.v1;

// Live view and control of the attached StreamDock N3 docks (USB 6603:1003).
//
// Controls, numbered as on the device (see docs/streamdock-n3-protocol.md):
//   keys 1-6   LCD keys, 3x2, row-major from the top left (they show images)
//   keys 7-9   plain buttons below the LCD keys, left to right (no image)
//   knobs 1-3  1 = bottom left, 2 = top, 3 = bottom right; they turn and press
//
// All UI traffic is binary protobuf over the Connect protocol.
service DeviceService {
  // Devices currently attached.
  rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse);

  // Every device event, pushed to all connected clients as it happens.
  //
  // The stream starts with one `attached` event per device that is already attached, so a client
  // needs no separate GetDevices call. A client that falls too far behind skips the events it
  // missed (it is told how many in `WatchEventsResponse.skipped`); it never slows down other
  // clients or the device.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // Sets the LCD brightness of a device.
  rpc SetBrightness(SetBrightnessRequest) returns (SetBrightnessResponse);

  // Shows an image on an LCD key (1-6). The daemon scales, rotates and encodes it for the device.
  rpc SetKeyImage(SetKeyImageRequest) returns (SetKeyImageResponse);

  // Clears an LCD key (1-6).
  rpc ClearKeyImage(ClearKeyImageRequest) returns (ClearKeyImageResponse);

  // Switches the dock to another mode (a module, see Screen.modes).
  rpc SetMode(SetModeRequest) returns (SetModeResponse);

  // Switches to another profile (see Screen.profiles); the choice survives restarts.
  rpc SetProfile(SetProfileRequest) returns (SetProfileResponse);

  // Presses a key or turns or presses a knob as if on the dock (H15-51): the input takes the same
  // path as the dock's own (modes, key actions, integrations) and is echoed in WatchEvents.
  rpc SendInput(SendInputRequest) returns (SendInputResponse);

  // Voice (H15-68/69): push-to-talk and wake word settings, `[modules.homeassistant.assist]`.
  rpc GetVoice(GetVoiceRequest) returns (GetVoiceResponse);
  // Checks and writes the settings; they apply without a restart.
  rpc SaveVoice(SaveVoiceRequest) returns (SaveVoiceResponse);
  // Home Assistant's assist pipelines (for the pipeline choice).
  rpc ListAssistPipelines(ListAssistPipelinesRequest) returns (ListAssistPipelinesResponse);
  // Adds a microWakeWord model trained elsewhere (`.tflite` + its `.json` manifest), after checking
  // it; replaces an upload with the same id.
  rpc UploadWakeWord(UploadWakeWordRequest) returns (UploadWakeWordResponse);
  // Removes an uploaded model (not the one in use, not a built-in one).
  rpc DeleteWakeWord(DeleteWakeWordRequest) returns (DeleteWakeWordResponse);

  // Tabs (H15-32): every change edits config.toml and is applied by hot reload.
  // Adds a lights, music or keys tab; returns its mode id.
  rpc AddTab(AddTabRequest) returns (AddTabResponse);
  rpc RenameTab(RenameTabRequest) returns (RenameTabResponse);
  // A music tab's Lyrion player as configured (name or MAC; empty = the default), and changing it
  // (H15-87). Pick the value from GetSettingChoices("lyrion", "player"): the player's MAC.
  rpc GetMusicTab(GetMusicTabRequest) returns (GetMusicTabResponse);
  rpc SetMusicTabPlayer(SetMusicTabPlayerRequest) returns (SetMusicTabPlayerResponse);
  rpc DeleteTab(DeleteTabRequest) returns (DeleteTabResponse);
  // Sets the order of the tabs (of the given profile, if any).
  rpc MoveTabs(MoveTabsRequest) returns (MoveTabsResponse);
  // Replaces a lights or music tab by a custom keys tab doing the same, to edit key by key.
  rpc ConvertTab(ConvertTabRequest) returns (ConvertTabResponse);
  // What a lights tab's keys and knobs show and do.
  rpc GetLightsTab(GetLightsTabRequest) returns (GetLightsTabResponse);
  // Pins an entity to a key of a lights tab (or removes it); the tab then shows pinned entities only.
  rpc SetLightsKey(SetLightsKeyRequest) returns (SetLightsKeyResponse);
  rpc SetLightsKnob(SetLightsKnobRequest) returns (SetLightsKnobResponse);
  // The now-playing band of a music tab (H15-88): which keys, what text, how it scrolls.
  rpc GetNowPlaying(GetNowPlayingRequest) returns (GetNowPlayingResponse);
  rpc SetNowPlaying(SetNowPlayingRequest) returns (SetNowPlayingResponse);
  // Home Assistant entities that can go on a key (lights, switches, scenes, scripts …).
  rpc ListHomeAssistantEntities(ListHomeAssistantEntitiesRequest) returns (ListHomeAssistantEntitiesResponse);

  // The settings of the daemon and of every module, with descriptions for the settings screen.
  // Secrets are never returned, only whether they are set.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // Changes one module's settings (validated, written to the config file). Applied without a daemon
  // restart where possible; the response says if a restart is still needed.
  rpc UpdateModuleSettings(UpdateModuleSettingsRequest) returns (UpdateModuleSettingsResponse);

  // Sets a secret (e.g. the Home Assistant token). Write-only.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);

  // Suggestions for a setting, read from the live system (e.g. Home Assistant areas, Lyrion
  // players), using the values currently in the form.
  rpc GetSettingChoices(GetSettingChoicesRequest) returns (GetSettingChoicesResponse);

  // The whole configuration as one backup file (H15-26). Secrets (tokens) are never included.
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);

  // Replaces the configuration with a backup, keeping this machine's own values (listen address,
  // real/simulated docks, poll interval). The previous file is kept as `<config>.bak`.
  rpc ImportBackup(ImportBackupRequest) returns (ImportBackupResponse);

  // The uploaded key images (H15-28), with small previews.
  rpc ListKeyAssets(ListKeyAssetsRequest) returns (ListKeyAssetsResponse);

  // Uploads a key image (PNG or JPEG, at most 4 MB), replacing one of the same name. Keys refer to
  // it by name (`image = "lamp"` in `[[modules.keys.page.key]]`).
  rpc SetKeyAsset(SetKeyAssetRequest) returns (SetKeyAssetResponse);

  // Deletes a key image. Keys that use it show their text only.
  rpc DeleteKeyAsset(DeleteKeyAssetRequest) returns (DeleteKeyAssetResponse);

  // The custom key pages (`[modules.keys]`, H15-29) for the keys editor, with what its pickers offer.
  rpc GetKeyPages(GetKeyPagesRequest) returns (GetKeyPagesResponse);

  // Validates the pages exactly like the daemon does at startup, writes `[modules.keys]` (the rest of
  // the config file and its comments are kept) and applies it without a restart.
  rpc SaveKeyPages(SaveKeyPagesRequest) returns (SaveKeyPagesResponse);

  // This machine's Wi-Fi and Bluetooth (H15-38), via NetworkManager and BlueZ. Only with
  // `[network] manage = true`; otherwise `GetNetwork` says `managed = false` and the rest fail.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);

  // Lists the Wi-Fi networks in range, after a fresh scan when `rescan` is set (a few seconds).
  rpc ListWifiNetworks(ListWifiNetworksRequest) returns (ListWifiNetworksResponse);

  // Connects to a Wi-Fi network: with its saved connection, else with `password` (write-only,
  // stored by NetworkManager). Empty password for open networks.
  rpc ConnectWifi(ConnectWifiRequest) returns (ConnectWifiResponse);

  rpc DisconnectWifi(DisconnectWifiRequest) returns (DisconnectWifiResponse);

  // Deletes the saved connection (and its password) for an SSID.
  rpc ForgetWifi(ForgetWifiRequest) returns (ForgetWifiResponse);

  // Lists Bluetooth devices, after a scan of about 8 s when `scan` is set (powers the adapter on).
  rpc ListBluetoothDevices(ListBluetoothDevicesRequest) returns (ListBluetoothDevicesResponse);

  // Pairs (if needed), trusts and connects a device, e.g. a speaker.
  rpc ConnectBluetooth(ConnectBluetoothRequest) returns (ConnectBluetoothResponse);

  rpc DisconnectBluetooth(DisconnectBluetoothRequest) returns (DisconnectBluetoothResponse);

  // Unpairs and forgets a device.
  rpc RemoveBluetooth(RemoveBluetoothRequest) returns (RemoveBluetoothResponse);

  // Switches the Bluetooth adapter on or off.
  rpc SetBluetoothPower(SetBluetoothPowerRequest) returns (SetBluetoothPowerResponse);
  // Everything BlueZ says about one device (H15-49): profiles, transports and codecs, battery …
  rpc GetBluetoothDevice(GetBluetoothDeviceRequest) returns (GetBluetoothDeviceResponse);
  // Chooses a device's audio codec (and LDAC's quality), remembered and reapplied on every connect;
  // an empty codec goes back to PipeWire's automatic choice (H15-78).
  rpc SetBluetoothCodec(SetBluetoothCodecRequest) returns (SetBluetoothCodecResponse);
  // Whether a device's link is kept at 48 kHz (the default) or at the rate the headset chooses;
  // remembered per device, renegotiates a connected link at once (H15-78).
  rpc SetBluetoothLinkRate(SetBluetoothLinkRateRequest) returns (SetBluetoothLinkRateResponse);

  // Changes the Ethernet IPv4 setup (H15-42). The change is only tried: it is reverted after
  // `revert_in_seconds` unless ConfirmEthernet is called (from the new address), so a wrong
  // static address can't lock the board out.
  rpc SetEthernet(SetEthernetRequest) returns (SetEthernetResponse);

  // Keeps the Ethernet change on trial (writes it to NetworkManager's saved profile).
  rpc ConfirmEthernet(ConfirmEthernetRequest) returns (ConfirmEthernetResponse);

  // When the Wi-Fi radio is on (H15-44): "off" (Bluetooth has the chip alone), "fallback" (only
  // while Ethernet is down) or "both". Written to `[network] wifi` and applied at once.
  rpc SetWifiMode(SetWifiModeRequest) returns (SetWifiModeResponse);

  // This machine's audio (PipeWire, H15-50), where the daemon manages it (`[audio] manage = true`):
  // outputs, volume, tone. Changes also arrive live as `WatchEventsResponse.audio`.
  rpc GetAudio(GetAudioRequest) returns (GetAudioResponse);
  // Makes an output the one everything plays on; it goes first in the output priority (H15-79).
  rpc SetAudioOutput(SetAudioOutputRequest) returns (SetAudioOutputResponse);
  // The output priority (H15-79): the highest present output plays, a lower one stands in.
  rpc GetOutputPriority(GetOutputPriorityRequest) returns (GetOutputPriorityResponse);
  rpc SetOutputPriority(SetOutputPriorityRequest) returns (SetOutputPriorityResponse);

  // Identity of this running daemon build (H15-77), also for external clients.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // Volume and mute of an output.
  rpc SetAudioVolume(SetAudioVolumeRequest) returns (SetAudioVolumeResponse);
  // Every sound setting (tone, balance, character, loudness, correction, crossfeed, limiter),
  // applied to every output; kept across restarts.
  rpc SetAudioTone(SetAudioToneRequest) returns (SetAudioToneResponse);

  // The built-in Lyrion player (H15-52): its `[player]` settings and live state (the state also
  // arrives as `WatchEventsResponse.player`).
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);
  // Saves `[player]` and applies it without a restart: a new name renames the player in Lyrion,
  // other changes reconnect it.
  rpc SetPlayer(SetPlayerRequest) returns (SetPlayerResponse);
  // The Lyrion servers that answer discovery on the LAN (takes about 2 s).
  rpc FindLyrionServers(FindLyrionServersRequest) returns (FindLyrionServersResponse);
  // Drops the connection and connects again (to the configured server, or discovery: "switch server").
  rpc ReconnectPlayer(ReconnectPlayerRequest) returns (ReconnectPlayerResponse);
  // A new player id: Lyrion sees a new player (the old one stays there, disconnected, until removed).
  rpc ResetPlayerId(ResetPlayerIdRequest) returns (ResetPlayerIdResponse);
}

message Device {
  // Stable id of the dock: its USB serial number.
  string id = 1;
  // Model name, e.g. "StreamDock N3".
  string model = 2;
  // Firmware version string reported by the dock, e.g. "V25.293N3_E.01.004".
  string firmware_version = 3;
  uint32 vendor_id = 4;
  uint32 product_id = 5;
  // Current LCD brightness, 0-100.
  uint32 brightness = 6;
}

message GetDevicesRequest {}

message GetDevicesResponse {
  repeated Device devices = 1;
}

message WatchEventsRequest {}

message WatchEventsResponse {
  // Set for device events; unset when this response carries `screen`.
  DeviceEvent event = 1;
  // Number of events this client missed right before this one because it fell behind.
  uint64 skipped = 2;
  // What the dock shows: sent at the start of the stream (after the attach snapshot) and whenever
  // the mode or a key face changes. The latest one replaces all earlier ones.
  Screen screen = 3;
  // Something the daemon or a module did. The stream starts with the recent history (oldest first).
  Activity activity = 4;
  // This machine's audio (H15-50): sent at the start of the stream and on every change, where the
  // daemon manages the audio. The latest one replaces all earlier ones.
  AudioState audio = 5;
  // This machine's network and Bluetooth (H15-49): sent at the start of the stream when the daemon
  // manages the network, and whenever something changes. The latest one replaces earlier ones.
  NetworkState network = 6;
  // Revisions of the config and the uploaded images (H15-49): sent at the start of the stream and
  // whenever either changes, from any browser, the dock or an edit on disk. Screens that show the
  // config (settings, keys editor, images) read it again when a revision changes.
  ConfigState config = 7;
  // The built-in Lyrion player (H15-55): sent at the start of the stream once the player was enabled,
  // and on every change. The latest one replaces all earlier ones.
  PlayerState player = 8;
  // The wake word (H15-68): sent at the start of the stream once it was enabled, a few times a second
  // while it listens (level, probability), and on every change. The latest replaces earlier ones.
  WakeWordState wake = 9;
}

// The wake word listener (H15-68).
message WakeWordState {
  // Listening for a wake word (configured and running).
  bool enabled = 1;
  // Model id and what to say, e.g. "okay_nabu" / "Okay Nabu".
  string model = 2;
  string wake_word = 3;
  // "listening", "request" (heard: the request runs), "starting" or "off".
  string phase = 4;
  // Why it isn't listening (no microphone, model error, …); empty when fine.
  string problem = 5;
  // Microphone level over the last 200 ms, dBFS (-100 … 0).
  float level_db = 6;
  // The model's latest probability and its sliding-window mean, 0-1.
  float probability = 7;
  float mean = 8;
  // The detection threshold in use.
  float threshold = 9;
  // How often it was heard since the listener started, and when last (Unix ms; 0 = never).
  uint32 heard_count = 10;
  uint64 heard_at_unix_ms = 11;
  // How the last request ended ("done", "nothing heard", "failed: …"); empty before the first.
  string last_result = 12;
}

// The built-in Lyrion player (H15-55, settings in H15-52).
message PlayerState {
  // The name in Lyrion (renamed there or in the config).
  string name = 1;
  // The player id in Lyrion, a MAC address such as "02:1a:…".
  string player_id = 2;
  // Connected to a Lyrion server.
  bool connected = 3;
  // The server's address (host:port), when known.
  string server = 4;
  // A track is playing (started and not finished); `paused` while it is paused.
  bool playing = 5;
  bool paused = 6;
  // The last problem, e.g. "no Lyrion server found"; empty when fine.
  string problem = 7;
  // `[player] enabled`: false once it was turned off (the other fields are then empty).
  bool enabled = 8;
  // The playing track's format as the player decodes it, e.g. "FLAC" or "PCM 44.1 kHz 16 bit".
  string format = 9;
  // Output and decoder buffer fill in percent (steps of 10), and output underruns since the start.
  uint32 output_fill = 10;
  uint32 decode_fill = 11;
  uint32 underruns = 12;
  // The current track as Lyrion describes it (empty when nothing plays).
  string title = 13;
  string artist = 14;
  string album = 15;
  // Lyrion's bitrate text, e.g. "320kbps CBR" or "1411kbps".
  string bitrate = 16;
  // Sample rates (H15-73): the stream as the player decodes it, the file as Lyrion has it (they
  // differ when Lyrion resampled on the server), and the output's (PipeWire's) rate; 0 if unknown.
  uint32 sample_rate = 17;
  uint32 source_sample_rate = 18;
  uint32 output_sample_rate = 19;
}

message ConfigState {
  // Changes whenever config.toml changes.
  uint64 revision = 1;
  // Changes whenever an image is uploaded, replaced or deleted.
  uint64 assets_revision = 2;
}

// What the network and Bluetooth settings show, pushed live (H15-49).
message NetworkState {
  GetNetworkResponse status = 1;
  // As ListBluetoothDevices returns them.
  repeated BluetoothDevice bluetooth_devices = 2;
  bool bluetooth_scanning = 3;
}

// An entry of the activity feed: an action a module ran and its result, a status change, a mode
// switch …
message Activity {
  // Increases with every entry; use it as a key.
  uint64 id = 1;
  uint64 timestamp_unix_ms = 2;
  // "daemon" or a module id, e.g. "homeassistant", "lyrion".
  string source = 3;
  ActivityLevel level = 4;
  // What happened, e.g. "toggle Deckenspots", "load playlist evening jazz on Buero Essence".
  string text = 5;
}

enum ActivityLevel {
  ACTIVITY_LEVEL_UNSPECIFIED = 0;
  // Something happened or started (a status change, an action sent).
  ACTIVITY_LEVEL_INFO = 1;
  // An action succeeded.
  ACTIVITY_LEVEL_OK = 2;
  // An action failed or a connection broke; `text` says why.
  ACTIVITY_LEVEL_ERROR = 3;
}

// What the dock shows, decided by the active module (mode). Applies to every attached dock.
message Screen {
  // The modes of the active profile (all enabled modules without profiles), in switching order
  // (knob 3 turns through them).
  repeated Mode modes = 1;
  // `Mode.id` of the active mode; empty when no module is enabled.
  string active_mode = 2;
  // One entry per LCD key (1-6) the active mode uses; keys without a face are blank.
  repeated KeyFace faces = 3;
  // What each knob does in the active mode.
  repeated KnobRole knobs = 4;
  // Configured profiles (H15-25), by name; "folder/name" groups them. Empty without profiles.
  repeated string profiles = 5;
  // Name of the active profile; empty without profiles.
  string active_profile = 6;
  // What the active music tab's player plays (H15-88); unset on other tabs.
  NowPlaying now_playing = 7;
}

// The current track of a music tab's player (H15-88), for the now-playing component.
message NowPlaying {
  string title = 1;
  string artist = 2;
  string album = 3;
  // The configured fields joined in their order, as the dock shows them (e.g. "Title · Artist").
  string text = 4;
  // Cover image URL (on the Lyrion server); empty without one.
  string cover_url = 5;
  // Track length; 0 when unknown (a radio stream).
  uint32 duration_ms = 6;
  // Position at `elapsed_at_unix_ms`; while playing the UI counts on from there.
  uint32 elapsed_ms = 7;
  int64 elapsed_at_unix_ms = 8;
  bool playing = 9;
  bool paused = 10;
  // The LCD keys showing the band on the dock (left to right); empty when the band is off.
  repeated uint32 keys = 11;
  // Scrolling as configured: speed in px per second, pause at each end, or "…" when false.
  uint32 scroll_px_per_second = 12;
  uint32 scroll_pause_ms = 13;
  bool scroll = 14;
  bool show_cover = 15;
  bool show_progress = 16;
  // The player is offline or nothing is loaded.
  bool idle = 17;
}

message Mode {
  // Stable id, e.g. "homeassistant", "lyrion".
  string id = 1;
  // Shown on the dock and in the UI, e.g. "Lights".
  string title = 2;
  // What kind of tab it is (H15-32): "lights", "music", "keys", "demo".
  string kind = 3;
}

message KeyFace {
  // 1-6.
  uint32 key = 1;
  // Main text, e.g. "Desk lamp".
  string label = 2;
  // Optional second line, e.g. "60 %" or "playing".
  string detail = 3;
  FaceState state = 4;
  // Optional key image (H15-28): the name of an uploaded image (see ListKeyAssets), drawn behind
  // the label. Empty: text only.
  string image = 5;
  // Part of the now-playing band (H15-88): drawn instead of label/detail.
  BandSlice band = 6;
  // A level 0-100 (e.g. the volume, H15-95): the key fills from the left like a bar, with the
  // percentage large on it and `label` small above (`detail`, when set, instead of the
  // percentage, e.g. "3200 K"). Unset: an ordinary face.
  optional uint32 level = 7;
  // How `level` is drawn (H15-97).
  LevelStyle level_style = 8;
}

// How a key draws its level (H15-97).
enum LevelStyle {
  // The plain bar (H15-95).
  LEVEL_STYLE_UNSPECIFIED = 0;
  // A colour temperature: the bar runs warm (left) to cold (right).
  LEVEL_STYLE_TEMPERATURE = 1;
  // The ordinary face (label, detail, image) with the level as a thin strip along the bottom,
  // e.g. a light's brightness on its own key.
  LEVEL_STYLE_STRIP = 2;
}

// One key of a band of keys that shows one scrolling line (H15-88). The band is `count` keys wide;
// this is key `index` (0 = left). The text is drawn `offset` px left of the band's start.
message BandSlice {
  string text = 1;
  int32 offset = 2;
  uint32 index = 3;
  uint32 count = 4;
  // Progress bar along the band's bottom edge, 0-1000; ignored without `show_progress`.
  uint32 progress = 5;
  bool show_progress = 6;
  // A cover cached by the daemon under this key, drawn dimmed behind the text; empty: none.
  string cover = 7;
  // Paused or idle: dimmer text.
  bool dim = 8;
}

enum FaceState {
  FACE_STATE_UNSPECIFIED = 0;
  // Neutral: an action that can be triggered.
  FACE_STATE_IDLE = 1;
  // Something that is on (a light, a toggle).
  FACE_STATE_ON = 2;
  // The current item (the playing playlist, the selected light).
  FACE_STATE_ACTIVE = 3;
  // Not reachable right now.
  FACE_STATE_UNAVAILABLE = 4;
}

message KnobRole {
  // 1-3.
  uint32 knob = 1;
  // e.g. "Brightness", "Volume".
  string label = 2;
}

message DeviceEvent {
  // `Device.id` of the device the event is about.
  string device_id = 1;
  // When the daemon saw the event, milliseconds since the Unix epoch.
  uint64 timestamp_unix_ms = 2;
  oneof kind {
    // The device was attached, or was already attached when the stream started.
    Device attached = 3;
    Detached detached = 4;
    KeyEvent key = 5;
    KnobEvent knob = 6;
    // A device property changed, e.g. the brightness. Carries the full device.
    Device updated = 7;
    // An LCD key now shows a new image (or is blank). Fetch the pixels from
    // `/dock/{device_id}/keys/{key}?v={version}`. Also sent for every key after `attached` at the
    // start of the stream.
    KeyImage key_image = 8;
  }
}

message KeyImage {
  // 1-6.
  uint32 key = 1;
  // Increases with every change of any key on any dock; use it to bust caches.
  uint64 version = 2;
  // True when the key is blank (nothing to fetch).
  bool blank = 3;
}

message Detached {}

message KeyEvent {
  // 1-6 LCD keys, 7-9 plain buttons.
  uint32 key = 1;
  // true = pressed down, false = released.
  bool pressed = 2;
}

message KnobEvent {
  // 1 = bottom left, 2 = top, 3 = bottom right.
  uint32 knob = 1;
  oneof action {
    // Detents turned: positive clockwise, negative counter-clockwise.
    sint32 turned = 2;
    // true = pressed down, false = released.
    bool pressed = 3;
  }
}

message SetBrightnessRequest {
  string device_id = 1;
  // 0-100; larger values are clamped to 100.
  uint32 percent = 2;
}

message SetBrightnessResponse {}

message SetKeyImageRequest {
  string device_id = 1;
  // 1-6.
  uint32 key = 2;
  // An encoded image (PNG or JPEG) of any size, shown upright; the daemon fits it to 64x64.
  bytes image = 3;
}

message SetKeyImageResponse {}

message ClearKeyImageRequest {
  string device_id = 1;
  // 1-6.
  uint32 key = 2;
}

message ClearKeyImageResponse {}

message SetModeRequest {
  // `Mode.id`.
  string mode = 1;
}

message SetModeResponse {}

message SetProfileRequest {
  // A name from `Screen.profiles`.
  string profile = 1;
}

message SetProfileResponse {}

message SendInputRequest {
  // `Device.id` of the dock the input is for.
  string device_id = 1;
  oneof input {
    // Keys 1-9. A click is a press followed by a release.
    KeyEvent key = 2;
    // Knobs 1-3; `turned` within -20..20 and not 0.
    KnobEvent knob = 3;
  }
}

message SendInputResponse {}

message GetSettingsRequest {}

message GetSettingsResponse {
  // The config file the settings live in (it may not exist yet).
  string config_path = 1;
  repeated ModuleSettings modules = 2;
  // Daemon settings, shown read-only (change them in the config file).
  repeated SettingValue daemon = 3;
}

message ModuleSettings {
  // Module id, e.g. "homeassistant".
  string id = 1;
  // e.g. "Lights (Home Assistant)".
  string title = 2;
  // What the module does, one or two sentences.
  string help = 3;
  // Whether the config has a table for the module, and whether it is enabled.
  bool configured = 4;
  bool enabled = 5;
  repeated SettingField fields = 6;
  // Current values by field key; empty for unset optional fields and for secrets.
  map<string, string> values = 7;
  // Problem with the current settings, if the module can't start with them.
  string error = 8;
}

message SettingField {
  string key = 1;
  string label = 2;
  string help = 3;
  SettingType type = 4;
  bool required = 5;
  // Shown as placeholder; used when the field is empty.
  string default_value = 6;
  // For secrets: whether one is stored.
  bool secret_set = 7;
  // Whether GetSettingChoices can suggest values for this field.
  bool has_choices = 8;
}

enum SettingType {
  SETTING_TYPE_UNSPECIFIED = 0;
  SETTING_TYPE_TEXT = 1;
  SETTING_TYPE_URL = 2;
  SETTING_TYPE_INTEGER = 3;
  SETTING_TYPE_BOOL = 4;
  // Write-only: set with SetSecret, never returned.
  SETTING_TYPE_SECRET = 5;
}

message SettingValue {
  string key = 1;
  string label = 2;
  string value = 3;
}

message UpdateModuleSettingsRequest {
  string module = 1;
  bool enabled = 2;
  // All non-secret fields by key; empty = unset (default).
  map<string, string> values = 3;
}

message UpdateModuleSettingsResponse {
  // True when the change only takes effect after a daemon restart. Module settings are applied
  // at once (hot reload); this is set only if that failed.
  bool restart_required = 1;
}

message SetSecretRequest {
  string module = 1;
  string key = 2;
  string value = 3;
}

message SetSecretResponse {}

message GetSettingChoicesRequest {
  string module = 1;
  string key = 2;
  // The form's current values (e.g. the URL to ask).
  map<string, string> values = 3;
}

message GetSettingChoicesResponse {
  // The values to suggest (for a free text field).
  repeated string choices = 1;
  // The same with a label, where the stored value isn't what people read: Lyrion players are
  // stored by MAC and shown by name (H15-87). Same order as `choices`.
  repeated SettingChoice options = 2;
}

message SettingChoice {
  // What is stored, e.g. "aa:aa:00:00:00:06".
  string value = 1;
  // What is shown, e.g. "airplay Bedroom".
  string label = 2;
  // A short state, e.g. "playing" or "offline"; empty for none.
  string detail = 3;
}

message ExportBackupRequest {}

message ExportBackupResponse {
  // The backup file (TOML).
  bytes data = 1;
  // Suggested file name, e.g. `streamdockd-backup-2026-10-18.toml`.
  string file_name = 2;
}

message ImportBackupRequest {
  bytes data = 1;
}

message ImportBackupResponse {
  // True when daemon settings outside the modules changed (e.g. brightness, night window), or
  // applying the modules failed; modules are otherwise applied at once.
  bool restart_required = 1;
  // Secrets the imported modules need but this machine doesn't have yet.
  repeated MissingSecret missing_secrets = 2;
  // What the import did, for the user (e.g. which local values were kept).
  repeated string notes = 3;
}

message MissingSecret {
  string module = 1;
  string key = 2;
  string label = 3;
}

// An uploaded key image.
message KeyAsset {
