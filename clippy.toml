# Product names that are not code identifiers in doc comments
doc-valid-idents = ["StreamDock", "OpenDeck", "..", "KNX", "NetworkManager", "BlueZ", "PipeWire", "WirePlumber"]

# Complexity limits (H15-36). Clippy counts macro expansions (a `tracing::warn!` with fields in a branch adds
# about 7), so 25 here is the "stricter" choice (about 15 real); see H15-36. `too_many_lines` stays 100.
cognitive-complexity-threshold = 25
excessive-nesting-threshold = 6
too-many-arguments-threshold = 7
