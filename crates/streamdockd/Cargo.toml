[package]
name = "streamdockd"
description = "StreamDock daemon: drives the dock and serves the live web UI and API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
build-info = { path = "../build-info" }
wakeword = { path = "../wakeword" }
ab_glyph = "0.2"
anyhow.workspace = true
axum.workspace = true
buffa = "0.9"
bytes = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
connectrpc = { version = "0.9", features = ["axum"] }
earshot = "1.2.2"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
include_dir = "0.7"
mdns-sd = "0.21"
player = { path = "../player" }
proa_core = "0.3.0"
proa_macros = "0.3.0"
proa_react = "0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
resvg = { version = "0.48", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slimproto = { path = "../slimproto" }
streamdock-hid.workspace = true
streamdock-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "connect"] }
toml = "0.9"
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
connectrpc = { version = "0.9", features = ["client"] }

[lints]
workspace = true
